<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私密视频 · 密码访问</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='14' width='20' height='13' rx='3' fill='%23E0A458'/%3E%3Cpath d='M11 14V10a5 5 0 0 1 10 0v4' fill='none' stroke='%23E0A458' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #101317;
    --surface: #181D23;
    --surface-2: #21272E;
    --border: rgba(255,255,255,.09);
    --text: #EDEFF2;
    --text-dim: #9AA4AE;
    --accent: #E0A458;
    --accent-deep: #C98E3E;
    --danger: #E06C5E;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:
      radial-gradient(1100px 520px at 50% -12%, rgba(224,164,88,.09), transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonicOS Sans SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 16px;
  }
  .screen { width:100%; max-width:420px; animation: fadeIn .35s ease both; }
  .hidden { display:none !important; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none;} }
  .card {
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px 24px 26px;
    box-shadow:0 14px 44px rgba(0,0,0,.38);
  }
  .lock-badge {
    width:56px; height:56px; border-radius:14px;
    background: var(--surface-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent); margin-bottom:20px;
  }
  h1 { font-size:22px; font-weight:700; letter-spacing:.02em; }
  .sub { margin-top:8px; color:var(--text-dim); font-size:14px; line-height:1.7; }
  form { margin-top:26px; }
  .pwd-row { display:flex; gap:10px; }
  input[type="password"] {
    flex:1; min-width:0;
    height:48px; padding:0 14px;
    font-size:16px; color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="password"]:focus { border-color:var(--accent); }
  input[type="password"]::placeholder { color:var(--text-dim); }
  button {
    height:48px; padding:0 22px; border:none; border-radius:10px;
    background:var(--accent); color:#17110A;
    font-size:16px; font-weight:600; cursor:pointer;
    transition:background .15s ease;
  }
  button:hover { background:var(--accent-deep); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.65; cursor:default; }
  .err { margin-top:12px; color:var(--danger); font-size:13px; min-height:18px; }
  .tip { margin-top:20px; color:var(--text-dim); font-size:12.5px; line-height:1.7; text-align:center; }
  .video-card { padding:18px 16px 14px; }
  .video-title { display:flex; align-items:center; gap:9px; margin-bottom:14px; font-size:15px; font-weight:600; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  video { width:100%; border-radius:10px; background:#000; display:block; }
  @media (min-width:768px) {
    body { padding:48px 24px; }
  }
</style>
</head>
<body>

  <!-- ===== 视图：闲鱼 / 阿里系 App 拦截 ===== -->
  <div id="screen-blocked" class="screen hidden">
    <div class="card" style="text-align:center;">
      <div class="lock-badge" style="margin:0 auto 20px;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8.2v3.6"></path><circle cx="12" cy="15.6" r=".7" fill="currentColor"></circle></svg>
      </div>
      <h1>请在微信 / QQ / 抖音中打开</h1>
      <p class="sub">当前是在闲鱼内打开的，无法观看视频。<br>请用微信、QQ 或抖音扫描二维码后访问本页面。</p>
    </div>
  </div>

  <!-- ===== 视图：密码锁 ===== -->
  <div id="screen-lock" class="screen">
    <div class="card">
      <div class="lock-badge">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path><circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"></circle></svg>
      </div>
      <h1>私密视频</h1>
      <p class="sub">输入访问密码后解锁观看</p>
      <form id="form" autocomplete="off">
        <div class="pwd-row">
          <input type="password" id="pwd" placeholder="请输入访问密码" aria-label="访问密码" autocomplete="new-password" autocapitalize="off" spellcheck="false">
          <button type="submit" id="btn">解锁</button>
        </div>
        <p class="err" id="err" aria-live="polite"></p>
      </form>
      <p class="tip">密码验证通过后，本页面将展示私密视频</p>
    </div>
  </div>

  <!-- ===== 视图：视频播放 ===== -->
  <div id="screen-video" class="screen hidden">
    <div class="card video-card">
      <div class="video-title"><span class="dot"></span>私密视频</div>
      <video id="player" controls playsinline webkit-playsinline x5-playsinline preload="none"></video>
      <p class="tip" id="videoTip">密码验证通过，可正常观看</p>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ===== 配置 ===== */
  // 访问密码的 SHA-256 哈希（当前密码：221a）
  var PWD_HASH = '810102b669384e502618871f5c557b994bf9ddd95e4a8ef48bb7ab55fa0a0487';
  // 视频文件名（与 index.html 同目录）
  var VIDEO_SRC = 'lv_0_20261018145949.mp4';

  /* ===== 元素 ===== */
  var screenBlocked = document.getElementById('screen-blocked');
  var screenLock    = document.getElementById('screen-lock');
  var screenVideo   = document.getElementById('screen-video');
  var form          = document.getElementById('form');
  var pwdInput      = document.getElementById('pwd');
  var errEl         = document.getElementById('err');
  var btn           = document.getElementById('btn');
  var player        = document.getElementById('player');
  var videoTip      = document.getElementById('videoTip');

  /* ===== 闲鱼 / 阿里系 App 环境检测（第二层防护） ===== */
  var ua = (navigator.userAgent || '').toLowerCase();
  var isAliApp = /idlefish|xianyu|闲鱼|aliapp|alibaba|alipay|yunos/.test(ua);
  if (isAliApp) {
    screenLock.classList.add('hidden');
    screenBlocked.classList.remove('hidden');
  }

  /* ===== SHA-256（紧凑实现，供不支持 crypto.subtle 的本地环境兜底） ===== */
  function sha256(ascii) {
    function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
    var mathPow = Math.pow;
    var maxWord = mathPow(2, 32);
    var lengthProperty = 'length';
    var i, j;
    var result = '';
    var words = [];
    var asciiBitLength = ascii[lengthProperty] * 8;
    var hash = sha256.h = sha256.h || [];
    var k = sha256.k = sha256.k || [];
    var primeCounter = k[lengthProperty];
    var isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += '\x80';
    while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii[lengthProperty]; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return;
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
    words[words[lengthProperty]] = (asciiBitLength);
    for (j = 0; j < words[lengthProperty];) {
      var w = words.slice(j, j += 16);
      var oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2];
        var a = hash[0], e = hash[4];
        var temp1 = hash[7]
          + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
          + ((e & hash[5]) ^ ((~e) & hash[6]))
          + k[i]
          + (w[i] = (i < 16) ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        var b = (hash[i] >> (j * 8)) & 255;
        result += ((b < 16) ? 0 : '') + b.toString(16);
      }
    }
    return result;
  }

  function hashPwd(s) {
    if (window.crypto && window.crypto.subtle) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
        var bytes = new Uint8Array(buf), hex = '';
        for (var i = 0; i < bytes.length; i++) hex += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);
        return hex;
      });
    }
    return Promise.resolve(sha256(s));
  }

  /* ===== 解锁 ===== */
  function showVideo() {
    screenLock.classList.add('hidden');
    screenVideo.classList.remove('hidden');
    player.src = VIDEO_SRC;
    player.load();
  }

  player.addEventListener('error', function () {
    videoTip.textContent = '视频加载失败，请确认已上传视频文件（video.mp4）';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = pwdInput.value.trim();
    if (!v) { errEl.textContent = '请输入密码'; pwdInput.focus(); return; }
    btn.disabled = true;
    btn.textContent = '验证中…';
    hashPwd(v).then(function (h) {
      if (h === PWD_HASH) {
        sessionStorage.setItem('vg-unlocked', '1');
        showVideo();
      } else {
        errEl.textContent = '密码不正确，请重试';
        pwdInput.select();
        btn.disabled = false;
        btn.textContent = '解锁';
      }
    });
  });

  pwdInput.addEventListener('input', function () { if (errEl.textContent) errEl.textContent = ''; });

  /* ===== 刷新后恢复已解锁状态 ===== */
  if (!isAliApp && sessionStorage.getItem('vg-unlocked') === '1') {
    showVideo();
  }
})();
</script>
</body>
</html>
